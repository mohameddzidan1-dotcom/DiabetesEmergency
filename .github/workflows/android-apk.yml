
name: Build Diabetes Emergency APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          packages: |
            platform-tools
            platforms;android-35
            build-tools;35.0.0
          accept-android-sdk-licenses: true

      - name: Extract project
        run: |
          mkdir project
          unzip -o DiabetesEmergency_PhoneBuild.zip -d project

      - name: Build APK
        run: |
          PROJECT_DIR=$(find project -name settings.gradle -printf '%h\n' | head -n 1)
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Diabetes-Emergency-APK
          path: project/**/build/outputs/apk/debug/*.apk
          
