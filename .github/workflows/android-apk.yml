name: Build Diabetes Emergency APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract Android project
        run: |
          mkdir project
          unzip -o DiabetesEmergency_PhoneBuild.zip -d project

      - name: Build APK
        working-directory: project
        run: |
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Diabetes-Emergency-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
